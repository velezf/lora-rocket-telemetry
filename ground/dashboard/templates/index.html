<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apogee ground station</title>
  <!-- Chart.js via CDN: fine for the home-Wi-Fi bench; vendor it for the field (rider). -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font:15px/1.4 system-ui, sans-serif; background:#0c0f14; color:#e6edf3; }
    header { padding:10px 14px; background:#131923; position:sticky; top:0; z-index:2; }
    header b { color:#7ee787; } header .call { color:#58a6ff; font-weight:600; }
    #health { font-size:12px; color:#9aa7b4; margin-top:3px; }
    main { display:grid; grid-template-columns:1fr; gap:10px; padding:10px; }
    @media (min-width:720px){ main { grid-template-columns:1fr 1fr; } }
    .panel { padding:12px; background:#131923; border-radius:12px; }
    .panel h2 { margin:0 0 6px; font-size:16px; display:flex; align-items:center; gap:8px; }
    .flag { font-size:12px; padding:1px 7px; border-radius:8px; background:#243040; color:#9aa7b4; }
    .flag.open { background:#1f6f43; color:#d7ffe6; }
    .age { margin-left:auto; font-size:12px; color:#9aa7b4; }
    .age.warn { color:#e3b341; } .age.stale { color:#f85149; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:6px 0; }
    .cell .k { font-size:11px; color:#9aa7b4; } .cell .v { font-size:19px; font-weight:600; }
    canvas { width:100%!important; height:110px!important; }
    .st-ascent{color:#7ee787} .st-descent{color:#ffa657} .st-pad{color:#9aa7b4}
    #events { margin:0 10px 14px; padding:10px 12px; background:#131923; border-radius:12px; font-size:12px; }
    #events h3 { margin:0 0 6px; font-size:13px; color:#9aa7b4; }
    #events li { list-style:none; color:#c7d0d9; } #events ul { margin:0; padding:0; }
  </style>
</head>
<body>
  <header>
    <b>Apogee</b> <span id="op" class="call"></span> <span id="conn"></span>
    <div id="health"></div>
  </header>
  <main id="panels"></main>
  <section id="events"><h3>events</h3><ul id="evlist"></ul></section>

<script>
const charts = {}, meta = {};
const ftxt = v => v==null ? '—' : v+'ft';

function ageClass(sec){ return sec>15?'age stale':(sec>5?'age warn':'age'); }
function tickAges(){
  const now = Date.now();
  for(const src in meta){
    const el = document.getElementById('age-'+src); if(!el) continue;
    const sec = meta[src].rx ? Math.round((now - Date.parse(meta[src].rx))/1000) : null;
    el.textContent = sec==null ? '' : sec+'s ago'; el.className = ageClass(sec ?? 0);
  }
}

function mkChart(id, color){
  return new Chart(document.getElementById(id), {
    type:'line', data:{labels:[],datasets:[{data:[],borderColor:color,pointRadius:0,tension:0.2}]},
    options:{animation:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{ticks:{color:'#9aa7b4'}}}}
  });
}

function render(vm){
  document.getElementById('conn').textContent = '● live';
  document.getElementById('op').textContent = vm.callsign ? 'op '+vm.callsign : '';
  const h = vm.health||{};
  document.getElementById('health').textContent =
    `${h.session??'—'} · up ${h.uptime_s??'—'}s · ${h.packets_per_min??'—'}/min · decoded ${h.decoded??'—'}`+
    ` · CRC-err ${h.crc_errors??0} · foreign ${h.foreign??0} · anom ${h.anomalies??0}`;

  for(const p of vm.panels){
    let el = document.getElementById('src-'+p.src);
    if(!el){   // SRC card appears when first seen
      el = document.createElement('section'); el.className='panel'; el.id='src-'+p.src;
      el.innerHTML = `<h2>SRC:${p.src} <span class="flag" id="fl-${p.src}"></span><span class="age" id="age-${p.src}"></span></h2>
        <div class="grid">
          <div class="cell"><div class="k">ALT (AGL)</div><div class="v" id="alt-${p.src}"></div></div>
          <div class="cell"><div class="k">PEAK</div><div class="v" id="pk-${p.src}"></div></div>
          <div class="cell"><div class="k">STATE</div><div class="v" id="st-${p.src}"></div></div>
          <div class="cell"><div class="k">RSSI</div><div class="v" id="rs-${p.src}"></div></div>
          <div class="cell"><div class="k">SEQ LOSS</div><div class="v" id="ls-${p.src}"></div></div>
          <div class="cell"><div class="k">T+ / RX</div><div class="v" id="tp-${p.src}"></div></div>
        </div>
        <div style="font-size:12px;color:#9aa7b4" id="cs-${p.src}"></div>
        <canvas id="alt-cv-${p.src}"></canvas><canvas id="rs-cv-${p.src}"></canvas>`;
      document.getElementById('panels').appendChild(el);
      charts[p.src] = { alt:mkChart('alt-cv-'+p.src,'#58a6ff'), rs:mkChart('rs-cv-'+p.src,'#ffa657') };
    }
    meta[p.src] = { rx:p.received_at };
    document.getElementById('alt-'+p.src).textContent = ftxt(p.altitude_ft);
    document.getElementById('pk-'+p.src).textContent  = ftxt(p.peak_ft);
    const st = document.getElementById('st-'+p.src); st.textContent=p.state; st.className='v st-'+p.state;
    document.getElementById('rs-'+p.src).textContent = p.rssi!=null?p.rssi+'dBm':'—';
    document.getElementById('ls-'+p.src).textContent = (p.seq_loss_pct??0)+'%';
    document.getElementById('tp-'+p.src).textContent = p.flight_open&&p.met_s!=null ? 'T+'+p.met_s+'s' : (p.packets_rx??0);
    document.getElementById('cs-'+p.src).textContent =
      (p.callsign?'ID '+p.callsign+'  ':'') + (p.flight_id?'flight '+p.flight_id:'');
    const fl=document.getElementById('fl-'+p.src);
    fl.textContent=p.flight_open?'IN FLIGHT':'idle'; fl.className='flag'+(p.flight_open?' open':'');
    const c=charts[p.src];
    c.alt.data.labels=p.trace.map(x=>x.t); c.alt.data.datasets[0].data=p.trace.map(x=>x.alt); c.alt.update();
    c.rs.data.labels=p.trace.map(x=>x.t); c.rs.data.datasets[0].data=p.trace.map(x=>x.rssi); c.rs.update();
  }
  const ev=document.getElementById('evlist');
  ev.innerHTML = (vm.events||[]).map(e=>`<li>${e.received_at?.slice(11,19)||''} ${e.event} ${e.src!=null?'SRC:'+e.src:''} ${e.flight_id||e.callsign||''}</li>`).join('');
  tickAges();
}

async function poll(){
  try{ const r=await fetch('/api/state'); render(await r.json()); }
  catch(e){ document.getElementById('conn').textContent='○ reconnecting'; }
}
poll(); setInterval(poll,1500); setInterval(tickAges,1000);
</script>
</body>
</html>
