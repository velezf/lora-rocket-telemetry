[platformio]
default_envs = feather_m0_tx

[env]
test_framework = unity

[env:feather_m0_tx]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
monitor_speed = 115200
; newlib-nano drops %f from printf by default, so float tags (G/Pg/T/Batt) encode
; empty on-target even though the host `native` tests pass. Force the float variant.
build_flags = -Wl,-u,_printf_float
test_ignore = *  ; never build host-logic tests against this embedded target — run the suite with: pio test -e native
lib_deps =
    mikem/RadioHead@1.120.0
    adafruit/Adafruit BMP3XX Library@2.1.6
    adafruit/Adafruit ADXL375@1.1.2
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit LSM6DS@4.7.4
    adafruit/Adafruit LIS3MDL@1.2.5

[env:feather_m0_tx_bench]
; BENCH build — NOT FLIGHT FIRMWARE. Identical to feather_m0_tx except
; BENCH_FORCE_FAST_TX forces the 10 Hz TX interval on the pad, for the A1.6
; sustained-rate bench (FIFO overwrites, inter-arrival, RX turn). The build
; announces itself on serial at boot. Re-flash feather_m0_tx before flight.
extends = env:feather_m0_tx
build_flags = ${env:feather_m0_tx.build_flags} -DBENCH_FORCE_FAST_TX

[env:native]
platform = native
; plain C++ via the host clang; only the pure logic in lib/ runs here.
; this env must stay dependency-free by design.
