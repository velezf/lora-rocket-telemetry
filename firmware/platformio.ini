[platformio]
default_envs = feather_m0_tx

[env]
test_framework = unity

[env:feather_m0_tx]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
monitor_speed = 115200
test_ignore = *  ; never build host-logic tests against this embedded target — run the suite with: pio test -e native
lib_deps =
    mikem/RadioHead@1.120.0
    adafruit/Adafruit BMP3XX Library@2.1.6
    adafruit/Adafruit ADXL375@1.1.2
    adafruit/Adafruit Unified Sensor@1.1.15

[env:native]
platform = native
; plain C++ via the host clang; only the pure logic in lib/ runs here.
; this env must stay dependency-free by design.
